<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>eBay Research</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#111827"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#172033}header{background:#111827;color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:21px}.sub{opacity:.7;font-size:12px;margin-top:3px}main{max-width:720px;margin:auto;padding:14px 14px 90px}.nav{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.nav button{border:0;background:#e5e7eb;border-radius:999px;padding:9px 13px;white-space:nowrap}.nav button.active{background:#111827;color:white}.card{background:white;border-radius:16px;padding:15px;margin:10px 0;box-shadow:0 2px 10px #0000000b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}label{font-size:12px;color:#667085;display:block;margin-bottom:4px}input,textarea,select{width:100%;border:1px solid #d7dce3;border-radius:10px;padding:11px;font-size:15px;background:#fff}textarea{min-height:75px;resize:vertical}.field{margin-bottom:10px}button.primary{width:100%;border:0;background:#2563eb;color:white;border-radius:11px;padding:12px;font-size:15px;font-weight:700}button.secondary{border:0;background:#eef2f7;border-radius:10px;padding:10px 12px}.stat{background:#f8fafc;border-radius:11px;padding:11px}.stat b{font-size:18px;display:block;margin-top:3px}.green{color:#15803d}.yellow{color:#a16207}.red{color:#b91c1c}.muted{color:#667085;font-size:12px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.tag{font-size:11px;border-radius:999px;background:#eef2ff;padding:4px 8px;color:#3730a3}.hidden{display:none}.item{border-top:1px solid #edf0f3;padding:12px 0}.item:first-child{border-top:0}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:10px 14px;display:flex;gap:8px}.bottom button{flex:1}.small{font-size:12px}.decision{border-radius:12px;padding:12px;background:#f8fafc;margin-top:10px}.decision strong{font-size:16px}</style></head><body>
<header><h1>eBay Research</h1><div class="sub">日本製品リサーチ・利益管理 v2</div></header><main>
<div class="nav"><button class="active" onclick="show('dash',this)">🏠 ホーム</button><button onclick="show('new',this)">➕ 登録</button><button onclick="show('quick',this)">⏱ 5分</button><button onclick="show('list',this)">📋 履歴</button></div>
<section id="dash"><div class="card"><h2 style="margin:0 0 12px">今日のリサーチ</h2><div class="grid3"><div class="stat"><span class="muted">商品</span><b id="count">0</b></div><div class="stat"><span class="muted">候補</span><b id="candidate">0</b></div><div class="stat"><span class="muted">平均利益</span><b id="avgprofit">¥0</b></div></div></div><div class="card"><div class="row"><h3 style="margin:0">⭐ 仕入れ候補</h3><button class="secondary small" onclick="show('list')">全部見る</button></div><div id="top"></div></div><div class="card"><h3 style="margin-top:0">🔎 保存キーワード</h3><div class="tag">日本製 軽量</div> <div class="tag">Japanese made</div> <div class="tag">Made in Japan</div> <div class="tag">precision tool</div> <div class="tag">vintage Japan</div></div></section>
<section id="new" class="hidden"><div class="card"><h2 style="margin-top:0">商品を登録</h2><div class="field"><label>商品名</label><input id="name" placeholder="例：資生堂 ビューラー"></div><div class="grid"><div class="field"><label>eBay検索キーワード</label><input id="keyword" placeholder="Shiseido eyelash curler"></div><div class="field"><label>メーカー</label><input id="maker" placeholder="Shiseido"></div></div><div class="grid"><div class="field"><label>Sold数（調査期間）</label><input id="sold" type="number" value="0" min="0"></div><div class="field"><label>現在出品数</label><input id="active" type="number" value="0" min="0"></div></div><div class="grid"><div class="field"><label>調査期間（日）</label><input id="days" type="number" value="30" min="1"></div><div class="field"><label>販売価格（USD）</label><input id="price" type="number" step="0.01" value="0" min="0"></div></div><div class="grid"><div class="field"><label>為替（円/USD）</label><input id="fx" type="number" value="150" min="1"></div><div class="field"><label>送料・その他（円）</label><input id="shipping" type="number" value="0" min="0"></div></div><div class="grid"><div class="field"><label>日本仕入価格（円）</label><input id="cost" type="number" value="0" min="0"></div><div class="field"><label>重量（g）</label><input id="weight" type="number" value="0" min="0"></div></div><div class="grid"><div class="field"><label>eBay等手数料率（%）</label><input id="fee" type="number" value="15" min="0" max="100"></div><div class="field"><label>最低目標利益（円）</label><input id="target" type="number" value="2000" min="0"></div></div><div class="field"><label>メモ</label><textarea id="memo" placeholder="海外で意外と需要あり、など"></textarea></div><div class="field"><label>ステータス</label><select id="status"><option>仕入れ候補</option><option>要再調査</option><option>保留</option><option>除外</option></select></div><div id="decision" class="decision"></div><div class="grid" style="margin-top:10px"><button class="secondary" onclick="openSoldSearch()">🔎 eBay Sold検索</button><button class="primary" onclick="save()">保存する</button></div></div><div class="card" id="preview"></div></section>
<section id="quick" class="hidden"><div class="card"><h2 style="margin-top:0">⏱ 5分リサーチ</h2><p class="muted">短時間で「再調査すべき商品」を確認します。</p><div id="quicklist"></div></div></section>
<section id="list" class="hidden"><div class="card"><h2 style="margin-top:0">📋 リサーチ履歴</h2><input id="filter" placeholder="商品名・キーワードで検索" oninput="renderList()"><div id="listbody"></div></div></section></main>
<div class="bottom"><button class="secondary" onclick="exportData()">💾 データ書出</button><button class="secondary" onclick="importData()">📥 読込</button></div><input id="file" type="file" accept=".json" class="hidden" onchange="loadFile(event)">
<script>
const KEY='ebayResearchV2';let data=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('ebayResearchV1')||'[]');const yen=n=>'¥'+Math.round(n).toLocaleString();function v(id){return document.getElementById(id).value}function calc(o){const revenue=o.price*o.fx,fee=revenue*o.fee/100,profit=revenue-fee-o.cost-o.shipping,roi=o.cost>0?profit/o.cost*100:0,str=o.active>0?o.sold/o.active*100:0,breakEven=o.cost+o.shipping,breakEvenUsd=o.fx>0?breakEven/(1-o.fee/100)/o.fx:0;return{revenue,fee,profit,roi,str,breakEvenUsd}}function decision(o,c){const t=o.target??2000;if(c.profit>=t&&c.roi>=30&&c.str>=30)return{label:'仕入れ候補',cls:'green',reason:'利益・ROI・回転率の3項目が目標ラインを超えています。'};if(c.profit>0&&(c.roi>=20||c.str>=20))return{label:'要再調査',cls:'yellow',reason:'利益は出ています。Sold期間・価格・送料をもう一度確認。'};return{label:'保留',cls:'red',reason:'現時点の入力値では利益または回転率が弱めです。'}}function calcCurrent(){return{price:+v('price')||0,fx:+v('fx')||150,cost:+v('cost')||0,shipping:+v('shipping')||0,fee:+v('fee')||15,active:+v('active')||0,sold:+v('sold')||0,days:+v('days')||30,target:+v('target')||2000}}function save(){const o={id:Date.now(),name:v('name'),keyword:v('keyword'),maker:v('maker'),sold:+v('sold'),active:+v('active'),days:+v('days')||30,price:+v('price'),fx:+v('fx'),cost:+v('cost'),weight:+v('weight'),shipping:+v('shipping'),fee:+v('fee'),target:+v('target')||2000,memo:v('memo'),status:v('status'),date:new Date().toLocaleDateString('ja-JP')};if(!o.name){alert('商品名を入力してください');return}o.status=decision(o,calc(o)).label;data.unshift(o);persist();alert('保存しました');reset();renderAll();show('list')}function persist(){localStorage.setItem(KEY,JSON.stringify(data))}function reset(){['name','keyword','maker','memo'].forEach(id=>document.getElementById(id).value='');['sold','active','price','cost','weight','shipping'].forEach(id=>document.getElementById(id).value=0);document.getElementById('days').value=30;document.getElementById('fx').value=150;document.getElementById('fee').value=15;document.getElementById('target').value=2000;document.getElementById('status').value='仕入れ候補'}function show(id,btn){['dash','new','quick','list'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');renderAll()}function renderAll(){document.getElementById('count').textContent=data.length;const cand=data.filter(x=>x.status==='仕入れ候補');document.getElementById('candidate').textContent=cand.length;const avg=data.length?data.reduce((a,x)=>a+calc(x).profit,0)/data.length:0;document.getElementById('avgprofit').textContent=yen(avg);document.getElementById('top').innerHTML=cand.slice(0,5).map(card).join('')||'<p class="muted">まだありません。「登録」から商品を追加してください。</p>';document.getElementById('quicklist').innerHTML=data.slice(0,10).map(card).join('')||'<p class="muted">まず商品を登録してください。</p>';renderList();preview()}function card(o){const c=calc(o),cls=c.profit>=(o.target??2000)?'green':c.profit>0?'yellow':'red';return `<div class="item"><div class="row"><b>${esc(o.name)}</b><span class="tag">${o.status}</span></div><div class="grid3" style="margin-top:8px"><div><span class="muted">Sold</span><br><b>${o.sold}</b></div><div><span class="muted">販売価格</span><br><b>$${o.price.toFixed(2)}</b></div><div><span class="muted">利益</span><br><b class="${cls}">${yen(c.profit)}</b></div></div><div class="muted" style="margin-top:6px">ROI ${c.roi.toFixed(0)}% ・ Sold率 ${c.str.toFixed(1)}% ・ ${o.date}</div></div>`}function renderList(){const q=(document.getElementById('filter')?.value||'').toLowerCase();const arr=data.filter(o=>(o.name+' '+o.keyword+' '+o.maker).toLowerCase().includes(q));document.getElementById('listbody').innerHTML=arr.map(o=>card(o)+`<button class="secondary small" onclick="removeItem(${o.id})">削除</button>`).join('')||'<p class="muted">該当商品なし</p>'}function removeItem(id){if(confirm('削除しますか？')){data=data.filter(x=>x.id!==id);persist();renderAll()}}function preview(){const el=document.getElementById('preview');if(!el)return;const o=calcCurrent(),c=calc(o),d=decision(o,c);el.innerHTML=`<h3 style="margin-top:0">💰 利益シミュレーション</h3><div class="grid3"><div class="stat">売上<b>${yen(c.revenue)}</b></div><div class="stat">手数料<b>${yen(c.fee)}</b></div><div class="stat">利益<b class="${c.profit>=o.target?'green':c.profit>0?'yellow':'red'}">${yen(c.profit)}</b></div></div><div class="grid3" style="margin-top:8px"><div class="stat"><span class="muted">ROI</span><b>${c.roi.toFixed(0)}%</b></div><div class="stat"><span class="muted">Sold率目安</span><b>${c.str.toFixed(1)}%</b></div><div class="stat"><span class="muted">損益分岐価格</span><b>$${c.breakEvenUsd.toFixed(2)}</b></div></div>`;document.getElementById('decision').innerHTML=`<div class="row"><strong>🧭 仕入れ判断：<span class="${d.cls}">${d.label}</span></strong></div><div class="muted" style="margin-top:6px">${d.reason}</div>`}function openSoldSearch(){const q=v('keyword')||v('name');if(!q){alert('eBay検索キーワードを入力してください');return}window.open('https://www.ebay.com/sch/i.html?_nkw='+encodeURIComponent(q)+'&LH_Sold=1&LH_Complete=1','_blank')}document.querySelectorAll('#new input,#new textarea,#new select').forEach(x=>x.addEventListener('input',preview));function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ebay-research-backup.json';a.click()}function importData(){document.getElementById('file').click()}function loadFile(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);persist();renderAll();alert('読み込みました')}catch{alert('JSONファイルを読み込めません')}};r.readAsText(f)}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}renderAll();
</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>
